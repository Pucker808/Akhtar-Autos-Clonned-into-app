name: Assemble Phase 2 TX files
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/tx-parts/**"
      - ".github/workflows/assemble-tx.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write files
        run: |
          python3 << 'PY'
          import base64, zlib, pathlib
          manifest = [
            {"path": "src-tauri/src/db_tx.rs", "part": "scripts/tx-parts/part0.b64"},
            {"path": "src-tauri/src/lib.rs", "part": "scripts/tx-parts/part1.b64"},
            {"path": "src/lib/migration.ts", "part": "scripts/tx-parts/part2.b64"},
            {"path": "src/lib/data-access/index.ts", "part": "scripts/tx-parts/part3.b64"},
            {"path": "src/lib/data-access/sqlite-adapter.ts", "part": "scripts/tx-parts/part4.b64"},
            {"path": "src/lib/data-access/types.ts", "part": "scripts/tx-parts/part5.b64"},
            {"path": "src/test/migration.test.ts", "part": "scripts/tx-parts/part6.b64"},
            {"path": "docs/PHASE2_TX.md", "part": "scripts/tx-parts/part7.b64"},
          ]
          for m in manifest:
              raw = pathlib.Path(m["part"]).read_text().strip()
              data = zlib.decompress(base64.b64decode(raw))
              p = pathlib.Path(m["path"])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print("wrote", m["path"], len(data))
          PY
      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db_tx.rs src-tauri/src/lib.rs src/lib/migration.ts src/lib/data-access src/test/migration.test.ts docs/PHASE2_TX.md
          git status
          git diff --cached --stat
          git commit -m "Phase 2 TX: assemble transactional SQLite layer + migration (Dexie still default)" || echo "no changes"
          git push
