name: Phase 2 Verify

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/**"
      - "src/lib/**"
      - "src/test/**"
      - "package.json"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/phase2-verify.yml"

jobs:
  rust-check:
    name: Rust cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Tauri 2 / Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo check
        run: cargo check --all-targets
        env:
          CARGO_TERM_COLOR: always

  frontend-test:
    name: TypeScript + Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Migration tests
        run: npx vitest run src/test/migration.test.ts

      - name: Persistence tests
        run: npx vitest run src/test/persistence.test.ts

      - name: Ops regression tests (Dexie accounting)
        run: npx vitest run src/test/ops.test.ts

      - name: Receipt + routing tests
        run: npx vitest run src/test/receipt.test.ts src/test/app-routing.test.tsx

  static-audit:
    name: Static consistency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify recovered sources and wiring
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re, hashlib

          root = Path(".")
          db_tx = (root / "src-tauri/src/db_tx.rs").read_text()
          lib_rs = (root / "src-tauri/src/lib.rs").read_text()
          migration = (root / "src/lib/migration.ts").read_text()
          adapter = (root / "src/lib/data-access/sqlite-adapter.ts").read_text()
          types = (root / "src/lib/data-access/types.ts").read_text()
          persistence = (root / "src/lib/persistence.ts").read_text()

          # No placeholders / include wrappers
          for name, text in [("db_tx.rs", db_tx), ("migration.ts", migration)]:
              if "include!" in text:
                  raise SystemExit(f"{name} still has include!")
              if "PLACEHOLDER" in text:
                  raise SystemExit(f"{name} has PLACEHOLDER")

          # Required Rust pub fns
          required_fns = [
              "apply_mutations", "export_table", "import_snapshot",
              "backup_database", "restore_database", "query_batches_fifo",
              "query_stock_qty", "get_row", "list_rows",
          ]
          for fn in required_fns:
              if f"pub fn {fn}" not in db_tx:
                  raise SystemExit(f"missing pub fn {fn} in db_tx.rs")

          # lib.rs registers commands
          required_cmds = [
              "apply_db_mutations", "import_db_snapshot", "export_db_table",
              "backup_database", "restore_database", "query_batches_fifo",
              "query_stock_qty", "get_db_row", "list_db_rows",
              "create_database", "check_database_path",
          ]
          for cmd in required_cmds:
              if cmd not in lib_rs:
                  raise SystemExit(f"lib.rs missing command {cmd}")

          # Adapter invoke names match commands
          invokes = re.findall(r'invoke(?:<[^>]+>)?\("([^"]+)"', adapter)
          for inv in set(invokes):
              if inv not in lib_rs and inv != "get_default_data_root":
                  # get_default_data_root is in lib.rs
                  pass
          for inv in set(invokes):
              if f"fn {inv}" not in lib_rs and f"{inv}," not in lib_rs and inv not in lib_rs:
                  raise SystemExit(f"adapter invokes unknown command: {inv}")

          # Dexie remains default
          if 'return "dexie"' not in persistence and "return 'dexie'" not in persistence:
              # tolerant of formatting
              if '"dexie"' not in persistence:
                  raise SystemExit("persistence.ts does not default to dexie")

          # Migration maps all Dexie tables
          for key in ["saleReturns", "purchaseReturns", "items", "batches", "ledger", "payments"]:
              if key not in migration:
                  raise SystemExit(f"migration.ts missing Dexie key {key}")

          # TABLE_ORDER parity
          if "sale_returns" not in db_tx or "purchase_returns" not in db_tx:
              raise SystemExit("db_tx TABLE_ORDER missing return tables")

          print("static audit OK")
          print("db_tx.rs bytes", len(db_tx.encode()))
          print("migration.ts bytes", len(migration.encode()))
          PY
