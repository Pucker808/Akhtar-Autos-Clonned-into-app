name: Phase 2 Verify

# Every step here is required. Do not add `continue-on-error`.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (strict TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: TypeScript strict check
        run: bun run typecheck
      - name: Full test suite (ops, migration, persistence, IPC contract, receipt, routing)
        run: bun run test
      - name: Production frontend build
        run: bun run build
      - name: Static entry point for Tauri exists
        run: test -s dist/client/index.html
      - name: Verification did not modify tracked files
        run: git diff --exit-code

  rust-linux:
    name: Rust on Linux (fmt, check, clippy, SQLite tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Tauri 2 / Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential file libssl-dev libgtk-3-dev libsoup-3.0-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Build frontend and a fresh migration snapshot from the current ops.ts
        run: |
          bun install --frozen-lockfile
          bun run build
          MIGRATION_FIXTURE_OUT="$RUNNER_TEMP/migration-snapshot.json" bunx vitest run src/test/migration.test.ts
          test -s "$RUNNER_TEMP/migration-snapshot.json"
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: cargo clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: cargo test (schema, transactions, import, backup/restore, IPC)
        run: MIGRATION_FIXTURE="$RUNNER_TEMP/migration-snapshot.json" cargo test --manifest-path src-tauri/Cargo.toml --locked

  windows:
    name: Windows (tests, release build, installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: TypeScript strict check
        run: bun run typecheck
      - name: Frontend test suite
        run: bun run test
      - name: Frontend build
        run: bun run build
      - name: Rust tests on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Tauri release build and installers
        run: bunx tauri build
      - name: Upload unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: akhtar-autos-windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Install smoke-test driver (outside the project)
        shell: bash
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
          echo "PW_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Build test-only installer with a debugging port (never uploaded)
        run: bunx tauri build --bundles nsis --config e2e/tauri.smoke.conf.json
      - name: Windows install and launch test
        shell: pwsh
        run: ./e2e/windows-smoke.ps1
      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshots
          path: ${{ runner.temp }}/smoke/*
          if-no-files-found: ignore

  android:
    name: Android (debug APK, emulator test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Generate Android project and icons
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bunx tauri android init --ci
          bunx tauri icon src-tauri/icons/icon-manifest.json
      - name: Build debug APK (test build, not for release)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bunx tauri android build --debug --apk --target aarch64 armv7 x86_64
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: akhtar-autos-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
      - name: Install smoke-test driver (outside the project)
        shell: bash
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
          echo "PW_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android install and launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./e2e/android-smoke.sh src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - name: Upload Android screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-results
          path: ${{ runner.temp }}/smoke/*
          if-no-files-found: ignore
