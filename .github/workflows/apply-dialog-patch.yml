name: Apply desktop dialog patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_dialog_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Phase 1: desktop-safe dialogs and print (replace browser prompt/confirm/open)"
            git push
          fi
