name: Cleanup obsolete recovery artifacts
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete recovery scripts and workflows
        run: |
          set -euo pipefail
          # Obsolete chunk/include recovery (sources are complete on main)
          rm -rf scripts/tx-recover-chunks scripts/tx-recover scripts/tx-parts
          # Obsolete recovery workflows (no longer needed)
          rm -f .github/workflows/recover-tx.yml
          rm -f .github/workflows/assemble-tx.yml
          rm -f .github/workflows/assemble-db.yml
          # Keep recover-complete-tx.yml disabled-by-removal of paste hosts risk:
          # neutralize by removing (sources already committed)
          rm -f .github/workflows/recover-complete-tx.yml
          # Keep cleanup + phase2-verify
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "nothing to clean"
          else
            git commit -m "Phase 2: remove obsolete recovery chunks and one-shot assemble/recover workflows"
            git push
          fi
