# One-shot helper to re-import frontend sources from the original web repository.
# Desktop-owned paths are protected and must never be deleted or overwritten.
name: Import frontend from web app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4
        with:
          path: desktop

      - name: Checkout web app (read-only source)
        uses: actions/checkout@v4
        with:
          repository: Pucker808/akhtar-autoparts-manager
          path: web

      - name: Copy frontend sources without wiping desktop files
        working-directory: ${
{ github.workspace }}
        run: |
          set -euo pipefail
          DESKTOP="$GITHUB_WORKSPACE/desktop"
          WEB="$GITHUB_WORKSPACE/web"

          # Never touch these desktop-owned paths
          PROTECT=(
            "src-tauri"
            "package.json"
            "README.md"
            ".gitignore"
            "docs/ARCHITECTURE.md"
            "docs/PHASE1.md"
            "docs/SQLITE_MIGRATION.md"
            ".github"
            "tools"
            "vite.config.ts"
          )

          mkdir -p "$DESKTOP/src" "$DESKTOP/public" "$DESKTOP/docs"

          rsync -a "$WEB/src/components/" "$DESKTOP/src/components/"
          rsync -a "$WEB/src/hooks/" "$DESKTOP/src/hooks/"
          rsync -a "$WEB/src/lib/" "$DESKTOP/src/lib/"
          rsync -a "$WEB/src/routes/" "$DESKTOP/src/routes/"
          rsync -a "$WEB/src/test/" "$DESKTOP/src/test/"
          rsync -a "$WEB/public/" "$DESKTOP/public/"

          for f in src/styles.css src/router.tsx src/routeTree.gen.ts src/server.ts src/start.ts \
                   components.json eslint.config.js .prettierrc .prettierignore bunfig.toml; do
            if [ -f "$WEB/$f" ]; then
              mkdir -p "$DESKTOP/$(dirname "$f")"
              cp "$WEB/$f" "$DESKTOP/$f"
            fi
          done

          echo "Protected paths left untouched:"
          for p in "${PROTECT[@]}"; do echo " - $p"; done

      - name: Commit if changed
        working-directory: ${
{ github.workspace }}/desktop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No frontend changes to import."
          else
            git commit -m "chore: re-import frontend from akhtar-autoparts-manager (desktop-protected)"
            git push
          fi
