name: Import frontend from web app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4
        with:
          path: desktop

      - name: Checkout web app source
        uses: actions/checkout@v4
        with:
          repository: Pucker808/akhtar-autoparts-manager
          path: web

      - name: Copy frontend (preserve desktop package.json, README, src-tauri)
        working-directory: desktop
        run: |
          set -euo pipefail
          WEB="${GITHUB_WORKSPACE}/web"
          test -d "$WEB/src"
          mkdir -p src public docs
          rsync -a --delete --exclude='.git' "$WEB/src/" src/
          rsync -a "$WEB/public/" public/
          for f in components.json eslint.config.js tsconfig.json vite.config.ts vitest.config.ts bunfig.toml .env.example .prettierrc .prettierignore AGENTS.md; do
            if [ -f "$WEB/$f" ]; then cp "$WEB/$f" "./$f"; fi
          done
          for f in LOCAL_AND_DESKTOP.md google-drive-setup.md; do
            if [ -f "$WEB/docs/$f" ]; then cp "$WEB/docs/$f" "docs/$f"; fi
          done
          test -f src-tauri/tauri.conf.json
          test -f package.json
          echo "Copied frontend. package.json and src-tauri preserved."

      - name: Commit if changed
        working-directory: desktop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Phase 1: import complete frontend and business logic from akhtar-autoparts-manager"
            git push
          fi
