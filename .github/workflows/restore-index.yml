name: Restore index.tsx
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified index.tsx
        run: |
          set -euo pipefail
          curl -fsSL "https://paste.rs/2we8J" -o /tmp/index.tsx
          echo "9bc8ea04d983eb5af5c09f12b041407a377ac3892a34c35170258b5cc698f94c  /tmp/index.tsx" | sha256sum -c
          # sanity: must not be placeholder
          test "$(wc -c < /tmp/index.tsx)" -gt 10000
          grep -q 'createFileRoute' /tmp/index.tsx
          grep -q '})(); }}>Add item' /tmp/index.tsx
          cp /tmp/index.tsx src/routes/index.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Restore src/routes/index.tsx (syntax-fixed inventory handler)"
          git push
