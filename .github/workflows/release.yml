name: Release (Windows update)

# Publishes a signed installer and latest.json. Installed apps pick it up from there.
# Before running: raise "version" in src-tauri/tauri.conf.json, package.json and Cargo.toml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/phase2-verify.yml

  publish:
    name: Publish signed Windows release
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version and signing key
        id: version
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is missing."
            exit 1
          fi
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $VERSION."
            exit 1
          fi
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Raise the version first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bunx tauri
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Akhtar Autos v${{ steps.version.outputs.version }}
          releaseBody: Akhtar Autos Windows release. Installed apps update from inside the app.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
