name: Recover complete Phase 2 TX sources

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download complete sources and verify SHA-256
        run: |
          set -euo pipefail
          mkdir -p /tmp/recover-src

          # Expected SHA-256 of the complete original artifacts
          declare -A EXPECTED=(
            [db_tx.rs]=a43567f9b0fc70e452e204003928f2a12a60d2c223285b34ac226c3c251718c5
            [migration.ts]=35695372845d659682f8323799742babd5275d13cf585a91192941d6746c470a
            [migration.test.ts]=1587d48fff2d3c4c7eeff24df72deb66aa8c02cd6c106be65f0f092477a750d0
            [PHASE2_TX.md]=2c1a6f5eb388a1418ea1bbfcdadaaf83804b6a4a6c89fd5844e6f2edfe625eda
          )

          # Hosted complete files (paste.rs) — verified before this workflow was committed
          declare -A URLS=(
            [db_tx.rs]=https://paste.rs/41OA8
            [migration.ts]=https://paste.rs/QIPEA
            [migration.test.ts]=https://paste.rs/d7hej
            [PHASE2_TX.md]=https://paste.rs/7Oznk
          )

          for name in db_tx.rs migration.ts migration.test.ts PHASE2_TX.md; do
            echo "Downloading $name ..."
            curl -fsSL --retry 3 --retry-delay 2 "${URLS[$name]}" -o "/tmp/recover-src/$name"
            got=$(sha256sum "/tmp/recover-src/$name" | awk '{print $1}')
            want="${EXPECTED[$name]}"
            if [ "$got" != "$want" ]; then
              echo "SHA-256 mismatch for $name"
              echo "  expected: $want"
              echo "  got:      $got"
              exit 1
            fi
            echo "OK $name ($got) size=$(wc -c < /tmp/recover-src/$name)"
          done

      - name: Install complete sources (replace wrappers)
        run: |
          set -euo pipefail
          # Full db_tx.rs — not include parts
          mkdir -p src-tauri/src src/lib src/test docs
          cp /tmp/recover-src/db_tx.rs src-tauri/src/db_tx.rs
          cp /tmp/recover-src/migration.ts src/lib/migration.ts
          cp /tmp/recover-src/migration.test.ts src/test/migration.test.ts
          cp /tmp/recover-src/PHASE2_TX.md docs/PHASE2_TX.md

          # Remove obsolete include-part wrappers if present
          rm -f src-tauri/src/db_tx_part1.inc.rs \
                src-tauri/src/db_tx_part2.inc.rs \
                src-tauri/src/db_tx_part3.inc.rs

          # Sanity: must not still be an include-only wrapper
          if grep -q 'include!("db_tx_part' src-tauri/src/db_tx.rs; then
            echo "ERROR: db_tx.rs still looks like a wrapper"
            exit 1
          fi
          if ! grep -q 'pub fn apply_mutations' src-tauri/src/db_tx.rs; then
            echo "ERROR: apply_mutations missing from db_tx.rs"
            exit 1
          fi
          if ! grep -q 'export async function migrateDexieToSqlite' src/lib/migration.ts; then
            echo "ERROR: migrateDexieToSqlite missing from migration.ts"
            exit 1
          fi
          echo "Source install OK"
          wc -c src-tauri/src/db_tx.rs src/lib/migration.ts src/test/migration.test.ts docs/PHASE2_TX.md

      - name: Commit recovered complete sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db_tx.rs src/lib/migration.ts src/test/migration.test.ts docs/PHASE2_TX.md
          git add -u src-tauri/src/db_tx_part1.inc.rs src-tauri/src/db_tx_part2.inc.rs src-tauri/src/db_tx_part3.inc.rs 2>/dev/null || true
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Phase 2 TX: recover complete db_tx.rs, migration.ts, tests, docs (SHA-256 verified)"
            git push
            echo "Committed and pushed"
            git rev-parse HEAD
          fi
