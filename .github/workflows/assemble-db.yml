name: Assemble db.rs
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/db.zlib.part*'
      - 'tools/assemble_db.py'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/assemble_db.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db.rs
          if git diff --staged --quiet; then echo no change; else
            git commit -m "Phase 2: assemble complete SQLite db.rs"
            git push
          fi
