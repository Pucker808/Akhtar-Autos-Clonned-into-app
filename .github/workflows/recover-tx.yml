name: Recover Phase 2 TX sources
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/tx-recover-chunks/**"
      - ".github/workflows/recover-tx.yml"
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate, decode, write sources
        run: |
          python3 << 'PY'
          import base64, zlib, pathlib, collections
          dests = {
            "db_tx_part1": "src-tauri/src/db_tx_part1.inc.rs",
            "db_tx_part2": "src-tauri/src/db_tx_part2.inc.rs",
            "db_tx_part3": "src-tauri/src/db_tx_part3.inc.rs",
            "migration": "src/lib/migration.ts",
            "migration_test": "src/test/migration.test.ts",
            "phase2_tx_md": "docs/PHASE2_TX.md",
          }
          root = pathlib.Path("scripts/tx-recover-chunks")
          groups = collections.defaultdict(list)
          for p in sorted(root.glob("*.b64c")):
              key = p.name.rsplit(".", 2)[0]
              idx = int(p.name.rsplit(".", 2)[1])
              groups[key].append((idx, p.read_text().strip()))
          for key, dest in dests.items():
              parts = groups.get(key, [])
              if not parts:
                  raise SystemExit(f"missing chunks for {key}")
              parts.sort()
              b64 = "".join(t for _, t in parts)
              data = zlib.decompress(base64.b64decode(b64))
              out = pathlib.Path(dest)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              text = data.decode()
              if "PLACEHOLDER" in text:
                  raise SystemExit(f"PLACEHOLDER in {dest}")
              print("wrote", dest, len(data))
          print("all recovered OK")
          PY
      - name: Commit recovered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/db_tx_part1.inc.rs src-tauri/src/db_tx_part2.inc.rs src-tauri/src/db_tx_part3.inc.rs src/lib/migration.ts src/test/migration.test.ts docs/PHASE2_TX.md
          git status
          git diff --cached --stat
          git commit -m "Phase 2 TX: recover complete db_tx includes, migration, tests, docs" || echo "no changes"
          git push
